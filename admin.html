<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | TSNGF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    
    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="login-container">
        <h2>تسجيل دخول الإدارة</h2>
        <input type="text" id="username" placeholder="اسم المستخدم (admin)">
        <input type="password" id="password" placeholder="كلمة المرور (12345)">
        <button id="login-btn" class="btn-primary">دخول</button>
        <p id="login-error" style="color: red; display: none;">بيانات الدخول خاطئة!</p>
        <br><br>
        <a href="index.html">العودة للموقع</a>
    </div>

    <!-- لوحة التحكم (مخفية حتى تسجيل الدخول) -->
    <div id="dashboard-screen" class="dashboard-container" style="display: none;">
        <header class="admin-header">
            <h2>نظام إدارة مبيعات TSNGF</h2>
            <button id="logout-btn" class="btn-outline">تسجيل الخروج</button>
        </header>

        <div class="admin-content">
            <h3>قاعدة بيانات عملاء الأفراد</h3>
            <div class="table-responsive">
                <table id="individuals-table">
                    <thead>
                        <tr>
                            <th>م</th>
                            <th>الاسم (رباعي)</th>
                            <th>الرقم القومي</th>
                            <th>رقم التليفون</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- سيتم إدراج البيانات عبر الجافاسكربت -->
                    </tbody>
                </table>
            </div>

            <h3 style="margin-top: 40px;">سجل مبيعات المؤسسات (B2B)</h3>
            <div class="table-responsive">
                <table id="institutions-table">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>اسم العميل / المؤسسة</th>
                            <th>المنتج</th>
                            <th>الكمية</th>
                            <th>إجمالي المبيعات</th>
                            <th>حالة الدفع</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- سيتم إدراج البيانات عبر الجافاسكربت -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
